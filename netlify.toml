[build]
  # Build le CSS Tailwind avant publication
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"

# Bundler par défaut pour les Netlify Functions
[functions]
  node_bundler = "esbuild"

# Redirections 301 — anciennes pages absorbées dans la refonte e-commerce
# Préserve le jus SEO des liens externes (Google, partages, bookmarks).
[[redirects]]
  from = "/realisations.html"
  to = "/histoire.html#realisations"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue.html"
  to = "/#services"
  status = 301
  force = true

# Cache long pour les assets statiques
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Headers sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
